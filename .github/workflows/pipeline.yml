name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本号 (例如 v1.0.5)'
        required: false
        default: 'v1.0.5'

# 权限最小化原则
permissions:
  contents: read

# 全局常量定义
env:
  APP_NAME: flutter-multiplatform-demo

# 并发防抖与自动取消：同一分支或标签有新提交触发时，自动取消旧在途任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # 阶段 1：全局质量门禁 (Lint & Test)
  # ========================================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 代码格式检查
        run: dart format --output=none --set-exit-if-changed .

      - name: 静态代码分析
        run: flutter analyze

      - name: 运行单元测试
        run: flutter test

  # ========================================================
  # 阶段 1.5：版本号与元数据解析 (仅在发布时执行)
  # ========================================================
  resolve-meta:
    name: Resolve Version Metadata
    needs: [lint-and-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: 解析版本号
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # ========================================================
  # 阶段 2：全平台与全架构并行构建与专业打包
  # ========================================================

  # 1. Android (Universal Fat APK，开启 Gradle 依赖缓存)
  build-android:
    name: Build Android APK
    needs: [lint-and-test, resolve-meta]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.resolve-meta.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 生成 Android 工程结构
        run: |
          flutter config --no-analytics
          flutter create . --platforms=android --org com.example

      - name: 获取依赖
        run: flutter pub get

      - name: 编译 Android APK (Release)
        run: flutter build apk --release

      - name: 规范化归档 Android 制品
        run: |
          ARTIFACT_NAME="${APP_NAME}_${VERSION}_android_universal.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$ARTIFACT_NAME"

      - name: 上传 Android 制品
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_NAME }}_${{ env.VERSION }}_android_universal.apk
          retention-days: 1

  # 2. iOS (Unsigned .ipa 测试包)
  build-ios:
    name: Build iOS IPA
    needs: [lint-and-test, resolve-meta]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.resolve-meta.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 生成 iOS 工程结构
        run: flutter create . --platforms=ios --org com.example

      - name: 获取依赖
        run: flutter pub get

      - name: 编译 iOS (Release, No CodeSign)
        run: flutter build ios --release --no-codesign

      - name: 规范化打包为未签名 IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "${APP_NAME}_${VERSION}_ios_arm64.ipa" Payload
          rm -rf Payload

      - name: 上传 iOS 制品
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.APP_NAME }}_${{ env.VERSION }}_ios_arm64.ipa
          retention-days: 1

  # 3. Web 静态资源整包
  build-web:
    name: Build Web Package
    needs: [lint-and-test, resolve-meta]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.resolve-meta.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 生成 Web 工程结构
        run: |
          flutter config --enable-web
          flutter create . --platforms=web

      - name: 获取依赖
        run: flutter pub get

      - name: 编译 Web 静态资源
        run: flutter build web --release

      - name: 规范化打包 Web 制品
        run: |
          cd build/web
          zip -r "../../${APP_NAME}_${VERSION}_web.zip" .
          cd ../..

      - name: 上传 Web 制品
        uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: ${{ env.APP_NAME }}_${{ env.VERSION }}_web.zip
          retention-days: 1

  # 4. Windows 桌面端 (绿色便携包 + Inno Setup 原生简体中文向导安装包)
  build-windows:
    name: Build Windows Desktop & Installer
    needs: [lint-and-test, resolve-meta]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.resolve-meta.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Inno Setup 编译器
        shell: pwsh
        run: choco install innosetup --no-progress

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 生成 Windows 工程结构
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows

      - name: 获取依赖
        shell: pwsh
        run: flutter pub get

      - name: 编译 Windows 桌面端
        shell: pwsh
        run: flutter build windows --release

      - name: 打包 Windows 绿色便携 ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "$($env:APP_NAME)_$($env:VERSION)_windows_x64_portable.zip"

      - name: 构建 Inno Setup 原生简体中文向导安装包
        shell: pwsh
        run: |
          $setupExeName = "$($env:APP_NAME)_$($env:VERSION)_windows_x64_setup"
          $issContent = @"
          [Setup]
          AppName=Flutter Multiplatform Demo
          AppVersion=$($env:VERSION)
          DefaultDirName={autopf}\FlutterMultiplatformDemo
          DefaultGroupName=Flutter Multiplatform Demo
          OutputDir=.
          OutputBaseFilename=$setupExeName
          Compression=lzma
          SolidCompression=yes
          DisableProgramGroupPage=yes

          [Languages]
          Name: "chinesesimplified"; MessagesFile: ".github\installer\ChineseSimplified.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\Flutter Multiplatform Demo"; Filename: "{app}\flutter_multiplatform_demo.exe"
          Name: "{autodesktop}\Flutter Multiplatform Demo"; Filename: "{app}\flutter_multiplatform_demo.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加快捷方式:"
          "@
          Set-Content -Path "installer.iss" -Value $issContent -Encoding utf8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: 上传 Windows 制品
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            ${{ env.APP_NAME }}_${{ env.VERSION }}_windows_x64_setup.exe
            ${{ env.APP_NAME }}_${{ env.VERSION }}_windows_x64_portable.zip
          retention-days: 1

  # 5. macOS 桌面端 (便携包 + 标准 DMG 挂载安装镜像)
  build-macos:
    name: Build macOS Desktop & DMG
    needs: [lint-and-test, resolve-meta]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.resolve-meta.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 生成 macOS 工程结构
        run: |
          flutter config --enable-macos-desktop
          flutter create . --platforms=macos

      - name: 获取依赖
        run: flutter pub get

      - name: 编译 macOS 桌面端
        run: flutter build macos --release

      - name: 打包 macOS 便携 ZIP (保留符号链接)
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/flutter_multiplatform_demo.app "${APP_NAME}_${VERSION}_macos_universal.zip"

      - name: 制作 macOS 标准 DMG 磁盘镜像
        run: |
          mkdir -p dmg_root
          cp -R "build/macos/Build/Products/Release/flutter_multiplatform_demo.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Flutter Multiplatform Demo" -srcfolder dmg_root -ov -format UDZO "${APP_NAME}_${VERSION}_macos_universal.dmg"
          rm -rf dmg_root

      - name: 上传 macOS 制品
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            ${{ env.APP_NAME }}_${{ env.VERSION }}_macos_universal.dmg
            ${{ env.APP_NAME }}_${{ env.VERSION }}_macos_universal.zip
          retention-days: 1

  # 6. Linux 桌面端与双架构安装包 (x86_64 与 ARM64 双架构：DEB + RPM + TAR.GZ)
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: [lint-and-test, resolve-meta]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.resolve-meta.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Linux 原生编译与 FPM 打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev ruby ruby-dev rubygems build-essential rpm
          sudo gem install --no-document fpm

      - name: 配置 Flutter 环境 (x86_64)
        if: matrix.arch == 'x86_64'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 配置 Flutter 环境 (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          git config --global --add safe.directory "$HOME/flutter"

      - name: 生成 Linux 工程结构
        run: |
          flutter config --enable-linux-desktop
          flutter create . --platforms=linux

      - name: 获取依赖
        run: flutter pub get

      - name: 编译 Linux 桌面端
        run: flutter build linux --release

      - name: 定位构建产物目录
        id: bundle
        run: |
          BUNDLE_DIR=$(find build/linux -type d -name "bundle" | head -n 1)
          echo "dir=$BUNDLE_DIR" >> $GITHUB_OUTPUT

      - name: 打包 Linux 绿色便携 TAR.GZ (保留执行权限)
        run: |
          cd "${{ steps.bundle.outputs.dir }}"
          tar -czvf "$GITHUB_WORKSPACE/${APP_NAME}_${VERSION}_linux_${{ matrix.arch }}_portable.tar.gz" *
          cd "$GITHUB_WORKSPACE"

      - name: 按照官方规范打包 DEB 与 RPM 安装包
        run: |
          mkdir -p pkg_root/opt/flutter_multiplatform_demo pkg_root/usr/bin pkg_root/usr/share/applications
          cp -r "${{ steps.bundle.outputs.dir }}"/* pkg_root/opt/flutter_multiplatform_demo/
          ln -s /opt/flutter_multiplatform_demo/flutter_multiplatform_demo pkg_root/usr/bin/flutter_multiplatform_demo

          cat << 'EOF' > pkg_root/usr/share/applications/flutter_multiplatform_demo.desktop
          [Desktop Entry]
          Name=Flutter Multiplatform Demo
          Comment=Flutter Multiplatform Demo Application
          Exec=/usr/bin/flutter_multiplatform_demo
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF

          # Debian 官方规范命名: <name>_<version>_<arch>.deb
          DEB_NAME="${APP_NAME}_${VERSION}_linux_${{ matrix.deb_arch }}.deb"
          fpm -s dir -t deb \
            -n flutter-multiplatform-demo \
            -v "${VERSION}" \
            -a "${{ matrix.deb_arch }}" \
            --description "Flutter Multiplatform Demo Application" \
            -C pkg_root \
            -p "$DEB_NAME"

          # RedHat RPM 官方规范命名: <name>-<version>-<release>.<arch>.rpm
          RPM_NAME="${APP_NAME}-${VERSION}-1.${{ matrix.rpm_arch }}.rpm"
          fpm -s dir -t rpm \
            -n flutter-multiplatform-demo \
            -v "${VERSION}" \
            -a "${{ matrix.rpm_arch }}" \
            --iteration 1 \
            --description "Flutter Multiplatform Demo Application" \
            -C pkg_root \
            -p "$RPM_NAME"

      - name: 上传 Linux 制品
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-artifacts
          path: |
            ${{ env.APP_NAME }}_${{ env.VERSION }}_linux_${{ matrix.arch }}_portable.tar.gz
            ${{ env.APP_NAME }}_${{ env.VERSION }}_linux_${{ matrix.deb_arch }}.deb
            ${{ env.APP_NAME }}-${{ env.VERSION }}-1.${{ matrix.rpm_arch }}.rpm
          retention-days: 1

  # 7. HarmonyOS NEXT (纯血鸿蒙 / OpenHarmony HAP 安装包)
  build-harmonyos:
    name: Build HarmonyOS HAP
    needs: [lint-and-test, resolve-meta]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERSION: ${{ needs.resolve-meta.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 运行环境
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 配置 Java 17 运行环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Linux 原生编译与图形库依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev jq

      - name: 安装并配置 HarmonyOS NEXT CLI 编译套件 (API 12+)
        continue-on-error: true
        uses: ErBWs/setup-ohos@v2
        with:
          version: 6.1.1.280
          cache: true

      - name: 配置鸿蒙环境变量
        run: |
          echo "FLUTTER_GIT_URL=https://gitcode.com/openharmony-sig/flutter_flutter.git" >> $GITHUB_ENV
          echo "DEVECO_SDK_HOME=$HOS_SDK_HOME" >> $GITHUB_ENV
          echo "TOOL_HOME=/home/runner/ohos-sdk/command-line-tools" >> $GITHUB_ENV

      - name: 克隆 OpenHarmony-SIG 定制版 Flutter SDK (3.22 分支)
        run: |
          git clone --depth 1 -b 3.22.0-ohos https://gitcode.com/openharmony-sig/flutter_flutter.git "$HOME/flutter_ohos"
          echo "$HOME/flutter_ohos/bin" >> $GITHUB_PATH
          git config --global --add safe.directory "$HOME/flutter_ohos"

      - name: 生成鸿蒙工程结构
        run: |
          export PATH="$HOME/flutter_ohos/bin:$PATH"
          export DEVECO_SDK_HOME="$HOS_SDK_HOME"
          flutter doctor -v || true
          flutter create . --platforms=ohos --project-name flutter_multiplatform_demo --org com.example

      - name: 注入鸿蒙适配依赖
        run: |
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  shared_preferences_ohos:" >> pubspec.yaml
          echo "    git:" >> pubspec.yaml
          echo "      url: https://gitcode.com/openharmony-sig/flutter_packages.git" >> pubspec.yaml
          echo "      path: packages/shared_preferences/shared_preferences_ohos" >> pubspec.yaml


      - name: 获取依赖并编译鸿蒙 Release HAP
        continue-on-error: true
        run: |
          export PATH="$HOME/flutter_ohos/bin:$PATH"
          export DEVECO_SDK_HOME="$HOS_SDK_HOME"
          flutter pub get
          flutter build hap --release


      - name: 规范化归档鸿蒙制品
        id: archive
        run: |
          HAP_FILE=$(find ohos -name "*.hap" 2>/dev/null | head -n 1)
          if [ -n "$HAP_FILE" ] && [ -f "$HAP_FILE" ]; then
            cp "$HAP_FILE" "${APP_NAME}_${VERSION}_harmonyos_arm64.hap"
            echo "has_hap=true" >> $GITHUB_OUTPUT
          else
            echo "未生成 HAP 产物，跳过上传"
            echo "has_hap=false" >> $GITHUB_OUTPUT
          fi

      - name: 上传鸿蒙制品
        if: steps.archive.outputs.has_hap == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: harmonyos-hap
          path: ${{ env.APP_NAME }}_${{ env.VERSION }}_harmonyos_arm64.hap
          retention-days: 1

  # ========================================================
  # 阶段 3：汇总所有平台制品，生成校验文件并自动发布 GitHub Release
  # ========================================================
  publish-release:
    name: Publish GitHub Release
    needs: [resolve-meta, build-android, build-ios, build-web, build-windows, build-macos, build-linux, build-harmonyos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve-meta.outputs.version }}
      TAG: ${{ needs.resolve-meta.outputs.tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 创建产物接收目录
        run: mkdir -p ./artifacts

      - name: 下载全部平台与架构制品
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: 生成 SHA-256 校验清单文件 (checksums.txt)
        run: |
          cd ./artifacts
          sha256sum * > checksums.txt
          cd ..

      - name: 检查收集到的全平台发布制品清单
        run: ls -lh ./artifacts

      - name: 动态生成结构化 Release 说明文档
        run: |
          cat << 'EOF' > release_notes.md
          ## 📦 全平台制品下载指引 (Release Downloads)

          | 操作系统 / 生态 | 架构 | 安装器 / 下载文件 | 格式 | 说明 |
          | :--- | :--- | :--- | :---: | :--- |
          | 💻 **Windows** | x64 | `${APP_NAME}_${VERSION}_windows_x64_setup.exe`<br>`${APP_NAME}_${VERSION}_windows_x64_portable.zip` | `.exe`<br>`.zip` | **Inno Setup 原生简体中文安装向导**<br>绿色免安装便携包 |
          | 🍎 **macOS** | Universal | `${APP_NAME}_${VERSION}_macos_universal.dmg`<br>`${APP_NAME}_${VERSION}_macos_universal.zip` | `.dmg`<br>`.zip` | **标准挂载磁盘安装镜像 (含拖拽安装)**<br>App Bundle 绿色包 |
          | 📱 **iOS** | arm64 | `${APP_NAME}_${VERSION}_ios_arm64.ipa` | `.ipa` | 未签名标准安装包 (支持 TrollStore / 自签) |
          | 🤖 **Android** | Universal | `${APP_NAME}_${VERSION}_android_universal.apk` | `.apk` | 生产环境 Release 胖包 (内置全架构原生库) |
          | 📱 **HarmonyOS NEXT** | arm64 | `${APP_NAME}_${VERSION}_harmonyos_arm64.hap` | `.hap` | **纯血鸿蒙 / OpenHarmony 标准安装包** (未签名测试包，支持真机/模拟器调试) |
          | 🌐 **Web** | Web | `${APP_NAME}_${VERSION}_web.zip` | `.zip` | 包含静态 HTML/JS/Wasm 资源的网站整包 |
          | 🐧 **Linux (PC/服务器)** | x86_64 | `${APP_NAME}_${VERSION}_linux_amd64.deb`<br>`${APP_NAME}-${VERSION}-1.x86_64.rpm`<br>`${APP_NAME}_${VERSION}_linux_x86_64_portable.tar.gz` | `.deb`<br>`.rpm`<br>`.tar.gz` | **Debian/Ubuntu 官方规范安装包**<br>**RedHat/CentOS/Fedora 规范安装包**<br>保留 0755 权限的绿色包 |
