name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本号 (例如 v1.0.3)'
        required: false
        default: 'v1.0.3'

# 并发防抖与自动取消：同一分支或标签有新提交时，自动取消旧构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # 阶段 1：全局质量门禁 (Lint & Test)
  # ========================================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 代码格式检查
        run: dart format --output=none --set-exit-if-changed .

      - name: 静态代码分析
        run: flutter analyze

      - name: 运行单元测试
        run: flutter test

  # ========================================================
  # 阶段 1.5：版本号与元数据解析 (仅在发布时执行)
  # ========================================================
  resolve-meta:
    name: Resolve Version Metadata
    needs: [lint-and-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      app_name: flutter-multiplatform-demo
    steps:
      - name: 解析版本号
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # ========================================================
  # 阶段 2：全平台与全架构并行构建与专业打包
  # ========================================================

  # 1. Android (Universal Fat APK)
  build-android:
    name: Build Android APK
    needs: [lint-and-test, resolve-meta]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ needs.resolve-meta.outputs.app_name }}
      VERSION: ${{ needs.resolve-meta.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 生成 Android 工程结构
        run: |
          flutter config --no-analytics
          flutter create . --platforms=android --org com.example

      - name: 获取依赖
        run: flutter pub get

      - name: 编译 Android APK (Release)
        run: flutter build apk --release

      - name: 规范化归档 Android 制品
        run: |
          ARTIFACT_NAME="${APP_NAME}_${VERSION}_android_universal.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$ARTIFACT_NAME"

      - name: 上传 Android 制品
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_NAME }}_${{ env.VERSION }}_android_universal.apk

  # 2. iOS (Unsigned .ipa 测试包)
  build-ios:
    name: Build iOS IPA
    needs: [lint-and-test, resolve-meta]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      APP_NAME: ${{ needs.resolve-meta.outputs.app_name }}
      VERSION: ${{ needs.resolve-meta.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 生成 iOS 工程结构
        run: flutter create . --platforms=ios --org com.example

      - name: 获取依赖
        run: flutter pub get

      - name: 编译 iOS (Release, No CodeSign)
        run: flutter build ios --release --no-codesign

      - name: 规范化打包为未签名 IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "${APP_NAME}_${VERSION}_ios_arm64.ipa" Payload
          rm -rf Payload

      - name: 上传 iOS 制品
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.APP_NAME }}_${{ env.VERSION }}_ios_arm64.ipa

  # 3. Web 静态资源整包
  build-web:
    name: Build Web Package
    needs: [lint-and-test, resolve-meta]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ needs.resolve-meta.outputs.app_name }}
      VERSION: ${{ needs.resolve-meta.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 生成 Web 工程结构
        run: |
          flutter config --enable-web
          flutter create . --platforms=web

      - name: 获取依赖
        run: flutter pub get

      - name: 编译 Web 静态资源
        run: flutter build web --release

      - name: 规范化打包 Web 制品
        run: |
          cd build/web
          zip -r "../../${APP_NAME}_${VERSION}_web.zip" .
          cd ../..

      - name: 上传 Web 制品
        uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: ${{ env.APP_NAME }}_${{ env.VERSION }}_web.zip

  # 4. Windows 桌面端 (绿色便携包 + Inno Setup 标准向导安装包)
  build-windows:
    name: Build Windows Desktop & Installer
    needs: [lint-and-test, resolve-meta]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      APP_NAME: ${{ needs.resolve-meta.outputs.app_name }}
      VERSION: ${{ needs.resolve-meta.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Inno Setup 编译器
        shell: pwsh
        run: choco install innosetup --no-progress

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 生成 Windows 工程结构
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows

      - name: 获取依赖
        shell: pwsh
        run: flutter pub get

      - name: 编译 Windows 桌面端
        shell: pwsh
        run: flutter build windows --release

      - name: 打包 Windows 绿色便携 ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "$($env:APP_NAME)_$($env:VERSION)_windows_x64_portable.zip"

      - name: 构建 Inno Setup 标准向导安装包
        shell: pwsh
        run: |
          $setupExeName = "$($env:APP_NAME)_$($env:VERSION)_windows_x64_setup"
          $issContent = @"
          [Setup]
          AppName=Flutter Multiplatform Demo
          AppVersion=$($env:VERSION)
          DefaultDirName={autopf}\FlutterMultiplatformDemo
          DefaultGroupName=Flutter Multiplatform Demo
          OutputDir=.
          OutputBaseFilename=$setupExeName
          Compression=lzma
          SolidCompression=yes
          DisableProgramGroupPage=yes

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\Flutter Multiplatform Demo"; Filename: "{app}\flutter_multiplatform_demo.exe"
          Name: "{autodesktop}\Flutter Multiplatform Demo"; Filename: "{app}\flutter_multiplatform_demo.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop icon"; GroupDescription: "Additional icons:"
          "@
          Set-Content -Path "installer.iss" -Value $issContent
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: 上传 Windows 制品
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            ${{ env.APP_NAME }}_${{ env.VERSION }}_windows_x64_setup.exe
            ${{ env.APP_NAME }}_${{ env.VERSION }}_windows_x64_portable.zip

  # 5. macOS 桌面端 (便携包 + 标准 DMG 挂载安装镜像)
  build-macos:
    name: Build macOS Desktop & DMG
    needs: [lint-and-test, resolve-meta]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      APP_NAME: ${{ needs.resolve-meta.outputs.app_name }}
      VERSION: ${{ needs.resolve-meta.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 生成 macOS 工程结构
        run: |
          flutter config --enable-macos-desktop
          flutter create . --platforms=macos

      - name: 获取依赖
        run: flutter pub get

      - name: 编译 macOS 桌面端
        run: flutter build macos --release

      - name: 打包 macOS 便携 ZIP (保留符号链接)
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/flutter_multiplatform_demo.app "${APP_NAME}_${VERSION}_macos_universal.zip"

      - name: 制作 macOS 标准 DMG 磁盘镜像
        run: |
          mkdir -p dmg_root
          cp -R "build/macos/Build/Products/Release/flutter_multiplatform_demo.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Flutter Multiplatform Demo" -srcfolder dmg_root -ov -format UDZO "${APP_NAME}_${VERSION}_macos_universal.dmg"
          rm -rf dmg_root

      - name: 上传 macOS 制品
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            ${{ env.APP_NAME }}_${{ env.VERSION }}_macos_universal.dmg
            ${{ env.APP_NAME }}_${{ env.VERSION }}_macos_universal.zip

  # 6. Linux 桌面端与双架构安装包 (x86_64 与 ARM64 双架构：DEB + RPM + TAR.GZ)
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: [lint-and-test, resolve-meta]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      APP_NAME: ${{ needs.resolve-meta.outputs.app_name }}
      VERSION: ${{ needs.resolve-meta.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Linux 原生编译与 FPM 打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev ruby ruby-dev rubygems build-essential rpm
          sudo gem install --no-document fpm

      - name: 配置 Flutter 环境 (x86_64)
        if: matrix.arch == 'x86_64'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 配置 Flutter 环境 (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          git config --global --add safe.directory "$HOME/flutter"

      - name: 生成 Linux 工程结构
        run: |
          flutter config --enable-linux-desktop
          flutter create . --platforms=linux

      - name: 获取依赖
        run: flutter pub get

      - name: 编译 Linux 桌面端
        run: flutter build linux --release

      - name: 定位构建产物目录
        id: bundle
        run: |
          BUNDLE_DIR=$(find build/linux -type d -name "bundle" | head -n 1)
          echo "dir=$BUNDLE_DIR" >> $GITHUB_OUTPUT

      - name: 打包 Linux 绿色便携 TAR.GZ (保留执行权限)
        run: |
          cd "${{ steps.bundle.outputs.dir }}"
          tar -czvf "$GITHUB_WORKSPACE/${APP_NAME}_${VERSION}_linux_${{ matrix.arch }}_portable.tar.gz" *
          cd "$GITHUB_WORKSPACE"

      - name: 按照官方规范打包 DEB 与 RPM 安装包
        run: |
          mkdir -p pkg_root/opt/flutter_multiplatform_demo pkg_root/usr/bin pkg_root/usr/share/applications
          cp -r "${{ steps.bundle.outputs.dir }}"/* pkg_root/opt/flutter_multiplatform_demo/
          ln -s /opt/flutter_multiplatform_demo/flutter_multiplatform_demo pkg_root/usr/bin/flutter_multiplatform_demo

          cat << 'EOF' > pkg_root/usr/share/applications/flutter_multiplatform_demo.desktop
          [Desktop Entry]
          Name=Flutter Multiplatform Demo
          Comment=Flutter Multiplatform Demo Application
          Exec=/usr/bin/flutter_multiplatform_demo
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF

          # Debian 官方规范命名: <name>_<version>_<arch>.deb
          DEB_NAME="${APP_NAME}_${VERSION}_linux_${{ matrix.deb_arch }}.deb"
          fpm -s dir -t deb \
            -n flutter-multiplatform-demo \
            -v "${VERSION}" \
            -a "${{ matrix.deb_arch }}" \
            --description "Flutter Multiplatform Demo Application" \
            -C pkg_root \
            -p "$DEB_NAME"

          # RedHat RPM 官方规范命名: <name>-<version>-<release>.<arch>.rpm
          RPM_NAME="${APP_NAME}-${VERSION}-1.${{ matrix.rpm_arch }}.rpm"
          fpm -s dir -t rpm \
            -n flutter-multiplatform-demo \
            -v "${VERSION}" \
            -a "${{ matrix.rpm_arch }}" \
            --iteration 1 \
            --description "Flutter Multiplatform Demo Application" \
            -C pkg_root \
            -p "$RPM_NAME"

      - name: 上传 Linux 制品
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-artifacts
          path: |
            ${{ env.APP_NAME }}_${{ env.VERSION }}_linux_${{ matrix.arch }}_portable.tar.gz
            ${{ env.APP_NAME }}_${{ env.VERSION }}_linux_${{ matrix.deb_arch }}.deb
            ${{ env.APP_NAME }}-${{ env.VERSION }}-1.${{ matrix.rpm_arch }}.rpm

  # ========================================================
  # 阶段 3：汇总所有平台制品，自动发布 GitHub Release
  # ========================================================
  publish-release:
    name: Publish GitHub Release
    needs: [resolve-meta, build-android, build-ios, build-web, build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 创建产物接收目录
        run: mkdir -p ./artifacts

      - name: 下载全部平台与架构制品
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: 检查收集到的全平台发布制品清单
        run: ls -lh ./artifacts

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-meta.outputs.tag }}
          name: Release ${{ needs.resolve-meta.outputs.tag }}
          files: ./artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
